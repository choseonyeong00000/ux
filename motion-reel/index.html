<!doctype html>
<meta charset="utf-8">
<title>Motion Reel</title>
<style>
  @font-face { font-family: "Pretendard"; font-weight: 900; src: url("node_modules/pretendard/dist/web/static/woff2/Pretendard-Black.woff2") format("woff2"); }
  @font-face { font-family: "Pretendard"; font-weight: 700; src: url("node_modules/pretendard/dist/web/static/woff2/Pretendard-Bold.woff2") format("woff2"); }
  @font-face { font-family: "Pretendard"; font-weight: 500; src: url("node_modules/pretendard/dist/web/static/woff2/Pretendard-Medium.woff2") format("woff2"); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 100vw; height: auto; }
</style>
<canvas id="out" width="1920" height="1080"></canvas>
<script>
/* ============================================================
   15s motion reel — every frame is a pure function of time.
   renderFrame(n) draws frame n (60fps) with sub-frame motion blur.
   ============================================================ */
const W = 1920, H = 1080, FPS = 60, DUR = 15, SUB = 4;
const BG = '#0c0c0d', FG = '#f3f0ea', AC = '#ff4a1c', DIM = '#7a7772';
const KR = 'Pretendard', EN = '"Inter Display", Inter';

const out = document.getElementById('out');
const octx = out.getContext('2d');
const fc = document.createElement('canvas'); fc.width = W; fc.height = H;
const c = fc.getContext('2d');

/* ---------- math ---------- */
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const p = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inCubic: x => x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  inOutQuart: x => x < .5 ? 8 * x * x * x * x : 1 - Math.pow(-2 * x + 2, 4) / 2,
  outBack: x => { const a = 1.70158, b = a + 1; return 1 + b * Math.pow(x - 1, 3) + a * Math.pow(x - 1, 2); },
  spring: x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.exp(-6 * x) * Math.cos(12 * x),
};
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const mixHex = (a, b, k) => {
  const h = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16));
  const A = h(a), B = h(b);
  return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',')})`;
};

/* ---------- drawing helpers ---------- */
const bg = col => { c.fillStyle = col; c.fillRect(0, 0, W, H); };
function rr(x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2))); }
function circle(x, y, r, col) { if (r <= 0) return; c.fillStyle = col; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); }
function line(x0, y0, x1, y1, col, w = 2) { c.strokeStyle = col; c.lineWidth = w; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke(); }

const _lay = new Map();
function layout(str, font, track = 0) {
  const key = font + '|' + track + '|' + str;
  if (_lay.has(key)) return _lay.get(key);
  c.font = font; c.letterSpacing = '0px';
  let x = 0; const g = [];
  for (const ch of str) { const w = c.measureText(ch).width; g.push({ ch, x, w }); x += w + track; }
  const res = { g, w: x - track };
  _lay.set(key, res); return res;
}
const fsize = font => parseFloat(font.match(/(\d+(\.\d+)?)px/)[1]);

/* masked per-glyph rise (and optional masked exit upward) */
function rise(str, font, x, y, col, t, t0, o = {}) {
  const { align = 'left', stagger = 0.03, dur = 0.7, track = 0, out = null, alpha = 1 } = o;
  const L = layout(str, font, track), s = fsize(font);
  const x0 = align === 'center' ? x - L.w / 2 : align === 'right' ? x - L.w : x;
  c.save();
  c.beginPath(); c.rect(x0 - 20, y - s * 0.98, L.w + 40, s * 1.3); c.clip();
  c.font = font; c.letterSpacing = '0px'; c.fillStyle = col; c.globalAlpha *= alpha; c.textBaseline = 'alphabetic';
  L.g.forEach((g, i) => {
    let dy = (1 - E.outExpo(p(t, t0 + i * stagger, t0 + i * stagger + dur))) * s * 1.3;
    if (out !== null) dy -= E.inCubic(p(t, out + i * stagger * .6, out + i * stagger * .6 + 0.3)) * s * 1.35;
    c.fillText(g.ch, x0 + g.x, y + dy);
  });
  c.restore();
  return L.w;
}
function label(str, x, y, col, o = {}) {
  const { size = 20, weight = 600, track = 4, align = 'left', family = EN, alpha = 1 } = o;
  c.save(); c.globalAlpha *= alpha;
  c.font = `${weight} ${size}px ${family}`; c.letterSpacing = track + 'px';
  c.textAlign = align; c.textBaseline = 'alphabetic'; c.fillStyle = col;
  c.fillText(str, x, y); c.restore(); c.letterSpacing = '0px'; c.textAlign = 'left';
}

/* ============================================================
   SCENES
   ============================================================ */

/* 00 — OPEN: dot → line → shutter → MOTION */
function s1(t) {
  bg(BG);
  const cx = W / 2, cy = H / 2, LW = 1500;
  const a = E.outBack(p(t, 0.1, 0.45));
  const st = E.inOutQuart(p(t, 0.5, 0.98));
  const open = E.outExpo(p(t, 1.0, 1.75));
  const gap = open * 205;
  const lw = lerp(28, LW, st) * a, lh = lerp(28, 4, st) * a;

  // title between the two lines
  if (open > 0) {
    const font = `900 340px ${EN}`;
    const L = layout('MOTION', font, 0);
    const track = (LW - L.w) / 5;
    const LL = layout('MOTION', font, track);
    c.save();
    c.beginPath(); c.rect(0, cy - gap, W, gap * 2); c.clip();
    c.font = font; c.fillStyle = FG;
    LL.g.forEach((g, i) => {
      const k = E.outExpo(p(t, 1.04 + i * 0.05, 1.7 + i * 0.05));
      c.fillText(g.ch, cx - LW / 2 + g.x, cy + 122 + (1 - k) * 420);
    });
    c.restore();
    const la = p(t, 1.25, 1.55);
    label('DESIGN REEL', cx - LW / 2, cy - gap - 22, FG, { alpha: la });
    label('2026', cx + LW / 2, cy - gap - 22, AC, { alpha: la, align: 'right' });
    label('모션 디자인 포트폴리오', cx - LW / 2, cy + gap + 44, FG, { alpha: la, family: KR, weight: 500, size: 22, track: 3 });
    label('15 SEC — 60 FPS', cx + LW / 2, cy + gap + 44, DIM, { alpha: la, align: 'right' });
  }
  c.fillStyle = AC;
  if (open <= 0) { rr(cx - lw / 2, cy - lh / 2, lw, lh, lh / 2); c.fill(); }
  else { c.fillRect(cx - LW / 2, cy - gap - 2, LW, 4); c.fillRect(cx - LW / 2, cy + gap - 2, LW, 4); }

  // wipe out
  const w = E.inCubic(p(t, 1.7, 2.0));
  if (w > 0) { c.fillStyle = AC; c.fillRect(0, 0, W * w, H); }
}

function bigGlyphs(str, size) { return layout(str, `900 ${size}px ${KR}`, 0); }

/* 01 — TIMING */
function s2a(t) {
  bg(BG);
  const size = 420, L = bigGlyphs('타이밍', size), x0 = W / 2 - L.w / 2, by = 665;
  c.font = `900 ${size}px ${KR}`; c.fillStyle = FG;
  L.g.forEach((g, i) => {
    const k = E.spring(p(t, 2.06 + i * 0.11, 2.75 + i * 0.11));
    const o = E.inExpo(p(t, 2.84 + i * 0.03, 3.0));
    c.fillText(g.ch, x0 + g.x, by - (1 - k) * 1000 + o * 700);
  });
  // ruler + playhead
  const rx0 = 330, rx1 = 1590, ry = 820, rp = E.outCubic(p(t, 2.05, 2.5));
  c.fillStyle = DIM;
  for (let i = 0; i <= 60; i++) {
    const x = lerp(rx0, rx1, i / 60); if ((i / 60) > rp) break;
    const h = i % 10 === 0 ? 26 : i % 5 === 0 ? 16 : 8;
    c.fillRect(x - 1, ry, 2, h);
  }
  const px = lerp(rx0, rx1, p(t, 2.0, 3.0));
  c.fillStyle = AC; c.fillRect(px - 2, ry - 34, 4, 78);
  c.beginPath(); c.moveTo(px - 12, ry - 46); c.lineTo(px + 12, ry - 46); c.lineTo(px, ry - 30); c.fill();
  rise('언제 움직이는가', `500 30px ${KR}`, rx0, ry + 84, FG, t, 2.2, { stagger: 0.015 });
  label(`${String(Math.floor(p(t, 2, 3) * 60)).padStart(2, '0')} F`, rx1, ry + 84, AC, { align: 'right', size: 24 });
  // wipe in
  const w = E.outCubic(p(t, 2.0, 2.4));
  if (w < 1) { c.fillStyle = AC; c.fillRect(W * w, 0, W, H); }
}

/* 02 — SPACING */
function s2b(t) {
  bg(FG);
  const size = 420, L = bigGlyphs('간격', size), cx = W / 2, by = 665;
  const d = lerp(60, 330, E.spring(p(t, 3.04, 3.85))) + E.inExpo(p(t, 3.85, 4.0)) * 1500;
  // guides
  c.globalAlpha = 0.18;
  line(cx - d, 0, cx - d, H, BG, 2); line(cx + d, 0, cx + d, H, BG, 2);
  c.globalAlpha = 1;
  c.font = `900 ${size}px ${KR}`; c.fillStyle = BG; c.textAlign = 'center';
  c.fillText('간', cx - d, by); c.fillText('격', cx + d, by);
  c.textAlign = 'left';
  // dimension line
  const y = 820;
  line(cx - d, y, cx + d, y, AC, 4);
  c.fillStyle = AC; c.fillRect(cx - d - 2, y - 18, 4, 36); c.fillRect(cx + d - 2, y - 18, 4, 36);
  const txt = `${Math.round(d * 2)} PX`;
  c.font = `700 26px ${EN}`; c.letterSpacing = '4px';
  const tw = c.measureText(txt).width + 36;
  c.fillStyle = FG; c.fillRect(cx - tw / 2, y - 20, tw, 40);
  label(txt, cx + 2, y + 9, AC, { align: 'center', size: 26, weight: 700 });
  rise('얼마나 움직이는가', `500 30px ${KR}`, cx, y + 84, BG, t, 3.15, { stagger: 0.015, align: 'center' });
}

/* 03 — RHYTHM */
function s2c(t) {
  bg(AC);
  const lt = t - 4, size = 420, L = bigGlyphs('리듬', size), x0 = W / 2 - L.w / 2, by = 610;
  // equalizer
  const n = 32, bw = W / n;
  c.fillStyle = BG;
  for (let i = 0; i < n; i++) {
    const st = lt * 8, k = Math.floor(st), f = E.outCubic(st - k);
    const h0 = hash(i * 13.7 + k), h1 = hash(i * 13.7 + k + 1);
    const beat = Math.exp(-((lt * 2) % 1) * 3);
    const h = (lerp(h0, h1, f) * 0.75 + 0.25) * (90 + 170 * beat) * E.outCubic(p(t, 4.0, 4.25));
    c.fillRect(i * bw + 8, H - h, bw - 16, h);
  }
  c.font = `900 ${size}px ${KR}`; c.fillStyle = BG;
  L.g.forEach((g, i) => {
    const ph = (lt - i * 0.125) * 4;                 // 8th-note bounce
    const b = lt - i * 0.125 > 0 ? Math.abs(Math.sin(Math.PI * ph)) : 0;
    const sq = 1 - 0.10 * Math.pow(1 - b, 6);        // squash at contact
    const en = E.outBack(p(t, 4.0 + i * 0.07, 4.3 + i * 0.07));
    c.save();
    c.translate(x0 + g.x + g.w / 2, by + 40);
    c.scale(en * (2 - sq), en * sq);
    c.fillText(g.ch, -g.w / 2, -40 - b * 70);
    c.restore();
  });
  rise('어떤 박자로 움직이는가', `500 30px ${KR}`, W / 2, 742, BG, t, 4.15, { stagger: 0.012, align: 'center' });
}

/* 04 — EASING */
function s3(t) {
  bg(BG);
  const lt = t - 5;
  const gx = 150, gy = 230, gs = 540;
  const bp = E.inOutCubic(p(t, 5.0, 5.6));
  // graph frame
  c.save();
  c.strokeStyle = DIM; c.lineWidth = 2; c.setLineDash([gs * 4 * bp, gs * 4]);
  c.strokeRect(gx, gy, gs, gs); c.restore();
  c.globalAlpha = 0.14 * bp;
  for (let i = 1; i < 6; i++) { line(gx + gs * i / 6, gy, gx + gs * i / 6, gy + gs, FG, 1); line(gx, gy + gs * i / 6, gx + gs, gy + gs * i / 6, FG, 1); }
  c.globalAlpha = 1;
  const m = E.inOutCubic(p(t, 6.45, 6.95));
  const f = x => lerp(E.inOutCubic(x), E.spring(x), m);
  const PX = x => gx + 60 + x * (gs - 120), PY = v => gy + gs - 70 - v * (gs - 190);
  const dp = E.outCubic(p(t, 5.25, 6.0));
  // target line (value = 1)
  c.save(); c.setLineDash([6, 8]); c.globalAlpha = 0.5 * dp; line(PX(0), PY(1), PX(1), PY(1), DIM, 2); c.restore();
  if (dp > 0) {
    c.strokeStyle = AC; c.lineWidth = 7; c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath();
    const n = 140;
    for (let i = 0; i <= n * dp; i++) { const x = i / n; i ? c.lineTo(PX(x), PY(f(x))) : c.moveTo(PX(x), PY(f(x))); }
    c.stroke(); c.lineCap = 'butt';
  }
  const k = Math.floor(lt), fr = lt - k, u = p(fr, 0.08, 0.88);
  if (dp > 0.2) {
    c.globalAlpha = 0.35; line(PX(u), PY(f(u)), PX(u), gy + gs, FG, 1); line(gx, PY(f(u)), PX(u), PY(f(u)), FG, 1); c.globalAlpha = 1;
    circle(PX(u), PY(f(u)), 13, FG);
  }
  label(m < 0.5 ? 'CUBIC-BEZIER(.65, 0, .35, 1)' : 'SPRING(STIFFNESS 144, DAMPING 12)', gx, gy + gs + 44, FG, { size: 19, track: 3, alpha: bp });
  label('T →', gx + gs, gy + gs + 44, DIM, { size: 19, align: 'right', alpha: bp });

  // tracks
  const tx0 = 900, tx1 = 1730, ys = [330, 520, 710];
  const fns = [x => x, E.inOutCubic, E.spring], names = ['LINEAR', 'EASE IN-OUT', 'SPRING'];
  const pos = (i, T) => {
    const kk = Math.floor(T), uu = p(T - kk, 0.08, 0.88), v = fns[i](uu);
    return lerp(tx0, tx1, T < 0 ? 0 : (kk % 2 ? 1 - v : v));
  };
  const grow = E.inExpo(p(t, 7.5, 8.0));
  for (let i = 0; i < 3; i++) {
    const y = ys[i], tp = E.outExpo(p(t, 5.05 + i * 0.1, 5.7 + i * 0.1));
    c.globalAlpha = 0.45; line(tx0, y, lerp(tx0, tx1, tp), y, DIM, 2); c.globalAlpha = 1;
    c.fillStyle = DIM; c.fillRect(tx0 - 1, y - 12, 2, 24); if (tp > .99) c.fillRect(tx1 - 1, y - 12, 2, 24);
    label(names[i], tx0, y - 62, i === 2 ? AC : FG, { size: 19, alpha: tp });
    label(`0${i + 1}`, tx1, y - 62, DIM, { size: 19, align: 'right', alpha: tp });
    const sc = E.outBack(p(t, 5.1 + i * 0.1, 5.45 + i * 0.1));
    const col = i === 2 ? AC : FG;
    for (let j = 7; j >= 1; j--) {
      c.globalAlpha = 0.22 * (1 - j / 8) * sc;
      circle(pos(i, lt - j * 0.03), y, 36 * sc * (1 - j * 0.05), col);
    }
    c.globalAlpha = 1;
    if (i === 0) { c.strokeStyle = FG; c.lineWidth = 4; c.beginPath(); c.arc(pos(i, lt), y, 34 * sc, 0, 7); c.stroke(); circle(pos(i, lt), y, 34 * sc, BG); c.stroke(); }
    else if (i === 2) circle(pos(i, lt), y, 36 * sc, col);
  }
  rise('같은 거리, 같은 시간 — 다른 감정.', `700 46px ${KR}`, tx0, 900, FG, t, 5.55, { stagger: 0.018 });
  // middle ball last: it swallows the frame
  const sc1 = E.outBack(p(t, 5.2, 5.55));
  circle(pos(1, lt), ys[1], 36 * sc1 + grow * 2500, FG);
}

/* 05 — SYSTEM */
function s4(t) {
  bg(FG);
  const cols = 9, rows = 5, cell = 168;
  const zoom = lerp(1, 1.32, E.inOutCubic(p(t, 10.25, 11.0)));
  c.save(); c.translate(W / 2, H / 2); c.scale(zoom, zoom);
  const dmax = Math.hypot(4, 2);
  const gapk = E.inOutCubic(p(t, 8.35, 8.85)) * (1 - E.inOutCubic(p(t, 9.95, 10.3)));
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const dx = i - 4, dy = j - 2, d = Math.hypot(dx, dy), dn = d / dmax;
    const tau = (t - 8) - d * 0.11;
    const en = E.outBack(p(tau, 0.0, 0.5));
    if (en <= 0) continue;
    const ph = Math.max(0, tau - 0.5) * 1.0, fl = Math.floor(ph), frac = ph - fl;
    const mm = 0.5 - 0.5 * Math.cos(Math.PI * 2 * ph);
    const center = dx === 0 && dy === 0;
    const x = E.inOutCubic(p(t, 10.25 + (1 - dn) * 0.25, 10.75 + (1 - dn) * 0.25));
    let round = lerp(1 - mm, center ? 1 : 0, x);
    let rot = lerp((fl + E.inOutCubic(frac)) * Math.PI / 2, (fl + 1) * Math.PI / 2, x);
    let size = lerp(cell * (0.48 + 0.26 * mm), center ? cell * 0.62 : cell * 1.02, x) * en;
    const accent = (i * 3 + j * 5) % 7 === 0 || center;
    if (dy === 0) size *= 1 - gapk;                  // middle row steps aside for the headline
    c.save(); c.translate(dx * cell, dy * cell + Math.sign(dy) * gapk * 64);
    if (center && x > 0) { c.fillStyle = BG; const s = cell * 1.02 * x; c.fillRect(-s / 2, -s / 2, s, s); }
    c.rotate(rot);
    c.fillStyle = accent ? (center ? AC : mixHex(AC, BG, x)) : BG;
    rr(-size / 2, -size / 2, size, size, size / 2 * round); c.fill();
    c.restore();
  }
  c.restore();
  rise('PATTERN', `900 250px ${EN}`, W / 2, 631, BG, t, 8.5, { align: 'center', stagger: 0.045, out: 9.55, track: 6 });
}

/* 06 — DEPTH */
const NP = 1400, PA = [], PB = [], PC = [];
for (let i = 0; i < NP; i++) {
  const y = 1 - 2 * (i + .5) / NP, r = Math.sqrt(1 - y * y), th = i * 2.399963;
  PA.push([Math.cos(th) * r * 310, y * 310, Math.sin(th) * r * 310]);
  const u = (i / NP) * Math.PI * 2 * 35, v = (i / NP) * Math.PI * 2;
  PB.push([(300 + 105 * Math.cos(u)) * Math.cos(v), 105 * Math.sin(u), (300 + 105 * Math.cos(u)) * Math.sin(v)]);
  const col = i % 40, row = Math.floor(i / 40);
  PC.push([(col / 39 - .5) * 900, 0, (row / 34 - .5) * 800]);
}
function s5(t) {
  bg(BG);
  const lt = t - 11;
  const cx = lerp(lerp(960, 1250, E.inOutCubic(p(t, 11.0, 11.7))), 960, E.inOutCubic(p(t, 13.0, 13.5)));
  const cy = 540;
  const sc = E.outExpo(p(t, 11.0, 11.8)) * (1 - E.inExpo(p(t, 13.1, 13.5)));
  const yaw = lt * 0.85 + 0.4, tilt = lerp(0.42, 0.62, E.inOutCubic(p(t, 12.45, 12.95)));
  const cyw = Math.cos(yaw), syw = Math.sin(yaw), ct = Math.cos(tilt), stl = Math.sin(tilt);
  for (let i = 0; i < NP; i++) {
    const s = (i / NP) * 0.3;
    const k1 = E.inOutCubic(p(t, 11.75 + s, 12.2 + s)), k2 = E.inOutCubic(p(t, 12.4 + s, 12.85 + s));
    const A = PA[i], B = PB[i], C = PC[i];
    const wy = Math.sin(C[0] * 0.011 + lt * 4) * Math.cos(C[2] * 0.011 + lt * 2) * 75;
    let x = lerp(lerp(A[0], B[0], k1), C[0], k2), y = lerp(lerp(A[1], B[1], k1), wy, k2), z = lerp(lerp(A[2], B[2], k1), C[2], k2);
    let X = x * cyw - z * syw, Z = x * syw + z * cyw;
    let Y = y * ct - Z * stl; Z = y * stl + Z * ct;
    const f = 1000 / (1000 + Z);
    const depth = cl(0.5 - Z / 700);
    c.globalAlpha = 0.25 + 0.75 * depth;
    circle(cx + X * f * sc, cy + Y * f * sc, (i % 9 === 0 ? 5.2 : 3.2) * f * (0.4 + 0.6 * sc), i % 9 === 0 ? AC : FG);
  }
  c.globalAlpha = 1;
  circle(cx, cy, 68 * (1 - E.outExpo(p(t, 11.0, 11.4))) + 14 * E.inExpo(p(t, 13.25, 13.5)), AC);
  rise('깊이', `900 300px ${KR}`, 140, 600, FG, t, 11.3, { stagger: 0.08, out: 12.95 });
  rise('보이지 않는 축을 더하다', `500 34px ${KR}`, 150, 690, FG, t, 11.5, { stagger: 0.015, out: 12.9 });
  const la = p(t, 11.6, 11.9) * (1 - p(t, 12.9, 13.1));
  ['X', 'Y', 'Z'].forEach((s, i) => label(s, 152 + i * 46, 760, i === 2 ? AC : DIM, { size: 22, alpha: la }));
}

/* 07 — SIGN-OFF */
function s6(t) {
  bg(BG);
  const cx = W / 2, cy = H / 2;
  const z = 1 + 0.035 * p(t, 13.5, 15);
  c.save(); c.translate(cx, cy); c.scale(z, z); c.translate(-cx, -cy);
  // shock ring
  const rk = p(t, 13.5, 14.2);
  if (rk < 1) { c.globalAlpha = (1 - rk) * 0.9; c.strokeStyle = AC; c.lineWidth = 3 + 10 * (1 - rk); c.beginPath(); c.arc(cx, cy, 14 + E.outExpo(rk) * 520, 0, 7); c.stroke(); c.globalAlpha = 1; }
  const font = `900 240px ${EN}`, by = 610;
  const wl = rise('CLAUDE', font, cx - 22, by, FG, t, 13.72, { align: 'center', stagger: 0.045, track: -2 });
  const k = E.inOutCubic(p(t, 13.6, 14.05));
  const tx = cx - 22 + wl / 2 + 40, ty = by - 22;
  circle(lerp(cx, tx, k), lerp(cy, ty, k) - Math.sin(Math.PI * k) * 150, lerp(14, 22, k), AC);
  const L = layout('MOTION DESIGN REEL — 2026', `600 22px ${EN}`, 7);
  rise('MOTION DESIGN REEL — 2026', `600 22px ${EN}`, cx, 372, FG, t, 13.95, { align: 'center', stagger: 0.008, track: 7 });
  const lk = E.outExpo(p(t, 14.0, 14.7));
  c.globalAlpha = 0.3; line(cx - 460 * lk, 668, cx + 460 * lk, 668, FG, 2); c.globalAlpha = 1;
  rise('모든 프레임을 코드로 그렸습니다', `500 34px ${KR}`, cx, 734, FG, t, 14.1, { align: 'center', stagger: 0.014, track: 2 });
  c.restore();
}

const SCENES = [
  { t0: 0, fn: s1, name: '00 — OPEN', hud: 'diff' },
  { t0: 2, fn: s2a, name: '01 — TIMING', hud: 'diff' },
  { t0: 3, fn: s2b, name: '02 — SPACING', hud: 'diff' },
  { t0: 4, fn: s2c, name: '03 — RHYTHM', hud: BG },
  { t0: 5, fn: s3, name: '04 — EASING', hud: 'diff' },
  { t0: 8, fn: s4, name: '05 — SYSTEM', hud: 'diff' },
  { t0: 11, fn: s5, name: '06 — DEPTH', hud: 'diff' },
  { t0: 13.5, fn: s6, name: '07 — SIGN-OFF', hud: 'diff' },
];

function hud(t, sc) {
  const a = p(t, 1.1, 1.5); if (a <= 0) return;
  c.save();
  const col = sc.hud === 'diff' ? '#fff' : sc.hud;
  if (sc.hud === 'diff') c.globalCompositeOperation = 'difference';
  c.globalAlpha = a;
  const M = 60, f = Math.floor(t * FPS + 1e-6);
  label('CLAUDE', M, 76, col, { size: 18 });
  label('MOTION REEL', M + 122, 76, col, { size: 18, weight: 400 });
  label(`00:${String(Math.floor(f / FPS)).padStart(2, '0')}:${String(f % FPS).padStart(2, '0')}`, W - M, 76, col, { size: 18, align: 'right' });
  label(sc.name, M, H - 66, col, { size: 18 });
  label('2026', W - M, H - 66, col, { size: 18, align: 'right' });
  c.globalAlpha = a * 0.3; c.fillStyle = col; c.fillRect(M, H - 48, W - M * 2, 2);
  c.globalAlpha = a; c.fillRect(M, H - 48, (W - M * 2) * (t / DUR), 2);
  c.restore();
}

function drawAt(t) {
  let sc = SCENES[0];
  for (const s of SCENES) if (t >= s.t0 - 1e-6) sc = s;
  c.save(); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over'; c.setLineDash([]);
  sc.fn(t);
  c.restore();
  hud(t, sc);
}

/* ---------- film grain + vignette ---------- */
const grain = document.createElement('canvas'); grain.width = grain.height = 512;
{
  const g = grain.getContext('2d'), id = g.createImageData(512, 512);
  let s = 1234567;
  for (let i = 0; i < id.data.length; i += 4) {
    s = (s * 1664525 + 1013904223) >>> 0;
    const v = (s >>> 24);
    id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255;
  }
  g.putImageData(id, 0, 0);
}
const vig = octx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 1.08);
vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,0.30)');

function renderFrame(n) {
  const t0 = n / FPS;
  octx.globalCompositeOperation = 'source-over';
  for (let i = 0; i < SUB; i++) {
    drawAt(t0 + (i / SUB) * (0.5 / FPS));        // 180° shutter
    octx.globalAlpha = 1 / (i + 1);
    octx.drawImage(fc, 0, 0);
  }
  octx.globalAlpha = 1;
  octx.fillStyle = vig; octx.fillRect(0, 0, W, H);
  octx.globalCompositeOperation = 'overlay'; octx.globalAlpha = 0.07;
  const ox = Math.floor(hash(n * 1.37) * 512), oy = Math.floor(hash(n * 2.11 + 9) * 512);
  for (let y = -oy; y < H; y += 512) for (let x = -ox; x < W; x += 512) octx.drawImage(grain, x, y);
  octx.globalCompositeOperation = 'source-over'; octx.globalAlpha = 1;
}
window.renderFrame = renderFrame;
window.ready = Promise.all([
  `900 100px ${KR}`, `700 40px ${KR}`, `500 30px ${KR}`,
].map(f => document.fonts.load(f, '타이밍간격리듬깊이'))).then(() => document.fonts.ready);

// live preview when opened directly in a browser
if (!navigator.webdriver) window.ready.then(() => {
  const start = performance.now();
  (function loop() { renderFrame(Math.floor(((performance.now() - start) / 1000 % DUR) * FPS)); requestAnimationFrame(loop); })();
});
